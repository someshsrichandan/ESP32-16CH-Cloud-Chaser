[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
monitor_speed = 115200
build_flags =
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
